<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Посты</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/header :: header('home')"></div>



<div class="container">
    <h1>Лента</h1>
    <a href="/new" class="btn">Новый пост</a>

    <!-- Список постов -->
    <div>
        <ul class="post-list" id="postList">
            <li th:each="post : ${posts}" class="post-item" data-post-id="${post.id}">
                <div class="author-info">
                    <div class="author-avatar">
                        <a th:href="@{/profile/{username}(username=${post.author})}">
                            <img th:src="@{${post.authorAvatar}}" alt="Avatar" class="avatar">
                        </a>
                    </div>
                    <a th:href="@{/profile/{username}(username=${post.author})}" class="author" th:text="'@' + ${post.author}"></a>
                </div>
                <h3 th:text="${post.title}"></h3>
                <p th:utext="${post.content}"></p>
                <small th:text="${post.formattedDate}"></small>
                
                <div class="post-actions">
                    <div class="left-actions">
                        <div class="like-container">
                            <button th:id="'likeBtn-' + ${post.id}" 
                                    class="like-button" 
                                    th:classappend="${post.isLikedByUser(#authentication.principal)} ? 'liked' : ''"
                                    th:onclick="'toggleLike(' + ${post.id} + ')'">
                                <i class="fas fa-heart"></i>
                                <span th:id="'likeCount-' + ${post.id}" th:text="${post.getLikeCount()}">0</span>
                            </button>
                            <div th:id="'likeUsers-' + ${post.id}" class="like-users-popup">
                                <div class="loading">Загрузка...</div>
                                <ul class="users-list"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="right-actions" sec:authorize="isAuthenticated()">
                        <button th:if="${post.author == #authentication.name}"
                                class="delete-button" 
                                th:onclick="'deletePost(\'' + ${post.id} + '\')'"
                                title="Удалить пост">
                            <img th:src="@{/images/trash.svg}" alt="Удалить">
                        </button>
                    </div>
                </div>
            </li>
        </ul>
        <div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<style>
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(98, 0, 234, 0.1);
    border-top: 4px solid var(--color-accent, #6200ea);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<script th:inline="javascript">
    let currentPage = /*[[${currentPage}]]*/ 0;
    let loading = false;
    let hasMore = /*[[${hasMore}]]*/ true;
    
    function isNearBottom() {
        return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200;
    }
    
    async function loadMorePosts() {
        if (loading || !hasMore) return;
        
        loading = true;
        document.getElementById('loadingIndicator').style.display = 'block';
        
        const nextPage = currentPage + 1;
        try {
            const response = await fetch(`/?page=${nextPage}&size=10`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            if (response.ok) {
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newPosts = doc.querySelectorAll('.post-item');
                
                if (newPosts.length === 0) {
                    hasMore = false;
                } else {
                    const postList = document.getElementById('postList');
                    newPosts.forEach(post => {
                        postList.appendChild(post.cloneNode(true));
                    });
                    currentPage = nextPage;
                    hasMore = doc.querySelector('#postList').children.length === 10;
                }
            }
        } catch (error) {
            console.error('Error loading posts:', error);
        } finally {
            loading = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }
    
    // Добавляем слушатель прокрутки с debounce
    let scrollTimeout;
    window.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            if (isNearBottom()) {
                loadMorePosts();
            }
        }, 100);
    });
    
    // Инициализация для маленьких экранов
    if (isNearBottom()) {
        loadMorePosts();
    }

    function deletePost(postId) {
        if (confirm('Вы уверены, что хотите удалить этот пост?')) {
            fetch(`/api/posts/${postId}`, {
                method: 'DELETE',
            })
            .then(response => {
                if (response.ok) {
                    const postElement = document.querySelector(`[onclick="deletePost('${postId}')"]`).closest('.post-item');
                    postElement.remove();
                } else {
                    alert('Ошибка при удалении поста');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Ошибка при удалении поста');
            });
        }
    }

    // Кэш для лайков
    const likeCache = new Map();
    
    async function toggleLike(postId) {
        const button = document.getElementById(`likeBtn-${postId}`);
        const countElement = document.getElementById(`likeCount-${postId}`);
        
        try {
            const response = await fetch(`/api/likes/toggle/${postId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new TypeError("Received non-JSON response from server");
            }
            
            const data = await response.json();
            
            // Обновляем UI
            button.classList.toggle('liked', data.liked);
            countElement.textContent = data.likeCount;
            
            // Очищаем кэш лайков
            likeCache.delete(postId);
            
            // Обновляем список пользователей, если попап открыт
            const popup = document.getElementById(`likeUsers-${postId}`);
            if (popup.classList.contains('show')) {
                const likeInfo = await lazyLoadLikeInfo(postId);
                if (likeInfo) {
                    const usersList = popup.querySelector('.users-list');
                    usersList.innerHTML = likeInfo.likedBy.length > 0
                        ? likeInfo.likedBy.map(user => `<li>@${user}</li>`).join('')
                        : '<li>Пока нет лайков</li>';
                }
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ошибка при обновлении лайка');
        }
    }
    
    async function lazyLoadLikeInfo(postId) {
        try {
            if (likeCache.has(postId)) {
                return likeCache.get(postId);
            }
            
            const response = await fetch(`/api/likes/users/${postId}`);
            const data = { likedBy: await response.json() };
            likeCache.set(postId, data);
            return data;
        } catch (error) {
            console.error('Error loading like info:', error);
            return null;
        }
    }

    // Оптимизированная загрузка списка лайкнувших пользователей
    let currentPopup = null;

    async function showLikeUsers(postId, button) {
        const popup = document.getElementById(`likeUsers-${postId}`);
        if (currentPopup && currentPopup !== popup) {
            currentPopup.classList.remove('show');
        }
        
        const likeInfo = await lazyLoadLikeInfo(postId);
        if (!likeInfo) return;
        
        const usersList = popup.querySelector('.users-list');
        const loading = popup.querySelector('.loading');
        
        usersList.innerHTML = likeInfo.likedBy.length > 0
            ? likeInfo.likedBy.map(user => `<li>@${user}</li>`).join('')
            : '<li>Пока нет лайков</li>';
            
        loading.style.display = 'none';
        usersList.style.display = 'block';
        
        const buttonRect = button.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        
        // Always position above the button
        popup.style.bottom = (window.innerHeight - buttonRect.top + 10) + 'px';
        popup.style.top = 'auto';
        popup.setAttribute('data-position', 'above');
        
        // Center horizontally relative to the button
        const popupWidth = 200; // Width from CSS
        let leftPosition = buttonRect.left + (buttonRect.width / 2) - (popupWidth / 2);
        
        // Ensure popup doesn't go off screen horizontally
        const minLeft = 10;
        const maxLeft = viewportWidth - popupWidth - 10;
        leftPosition = Math.max(minLeft, Math.min(maxLeft, leftPosition));
        
        popup.style.left = leftPosition + 'px';
        popup.classList.add('show');
        
        currentPopup = popup;
    }

    // Обработчики событий для лайков
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.like-container').forEach(container => {
            const button = container.querySelector('.like-button');
            const popup = container.querySelector('.like-users-popup');
            const postId = button.id.split('-')[1];

            // Показываем попап при наведении на кнопку лайка
            button.addEventListener('mouseenter', () => {
                showLikeUsers(postId, button);
                popup.classList.add('show');
            });

            // Скрываем попап при уходе курсора с контейнера
            container.addEventListener('mouseleave', () => {
                popup.classList.remove('show');
            });

            // Предотвращаем скрытие при наведении на сам попап
            popup.addEventListener('mouseenter', () => {
                popup.classList.add('show');
            });

            popup.addEventListener('mouseleave', () => {
                popup.classList.remove('show');
            });
        });
    });
</script>

<script>
    // Открытие SSE подключения для получения новых постов
    const eventSource = new EventSource('/stream');

    // Обработка новых постов
    eventSource.onmessage = function(event) {
        const post = JSON.parse(event.data);
        const postList = document.getElementById('postList');
        const postItem = document.createElement('li');
        postItem.classList.add('post-item');

        postItem.innerHTML = `
            <div class="author-info">
                <div class="author-avatar">
                    <a href="/profile/${post.author}">
                        <img src="${post.authorAvatar || '/uploads/avatars/default.png'}" alt="Avatar" class="avatar">
                    </a>
                </div>
                <a href="/profile/${post.author}" class="author">@${post.author}</a>
            </div>
            <h3>${post.title}</h3>
            <p>${post.content}</p>
            <small>${post.formattedDate}</small>
            <div class="post-actions">
                <div class="left-actions">
                    <div class="like-container">
                        <button id="likeBtn-${post.id}" class="like-button">
                            <i class="fas fa-heart"></i>
                            <span id="likeCount-${post.id}" class="like-count">0</span>
                        </button>
                        <div id="likeUsers-${post.id}" class="like-users-popup">
                            <div class="loading">Загрузка...</div>
                            <ul class="users-list"></ul>
                        </div>
                    </div>
                </div>
            </div>
        `;

        postList.insertBefore(postItem, postList.firstChild);
    };
</script>

</body>
</html>
