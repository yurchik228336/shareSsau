<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/header.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента</title>
</head>
<body>
    <div th:replace="fragments/header :: header('home')"></div>

<header class="header">
    <a href="/" class="home-btn">Главная</a>
    <a href="/profile" class="profile-btn">Профиль</a>
    <a href="/profile/profileEdit" class="profileEdit-btn">Редактировать профиль</a>
</header>

<div class="container">
    <h1>Лента</h1>
    <a href="/new" class="btn">Новый пост</a>

    <!-- Список постов -->
    <div>
        <ul class="post-list" id="postList">
            <li th:each="post : ${posts}" class="post-item">
                <div class="author-info">
                    <div class="author-avatar">
                        <a th:href="@{/profile/{username}(username=${post.author})}">
                            <img th:src="@{${post.authorAvatar}}" alt="Avatar" class="avatar">
                        </a>
                    </div>
                    <a th:href="@{/profile/{username}(username=${post.author})}" class="author" th:text="'@' + ${post.author}"></a>
                </div>
                <h3 th:text="${post.title}"></h3>
                <p th:utext="${post.content}"></p>
                <small th:text="${post.formattedDate}"></small>
                <div sec:authorize="isAuthenticated()">
                    <button th:if="${post.author == #authentication.name}"
                            class="delete-button" 
                            th:onclick="'deletePost(\'' + ${post.id} + '\')'"
                            title="Удалить пост">
                        <img th:src="@{/images/trash.svg}" alt="Удалить">
                    </button>
                </div>
            </li>
        </ul>
        <div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<style>
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(98, 0, 234, 0.1);
    border-top: 4px solid var(--color-accent, #6200ea);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<script th:inline="javascript">
    let currentPage = /*[[${currentPage}]]*/ 0;
    let loading = false;
    let hasMore = /*[[${hasMore}]]*/ true;
    
    function isNearBottom() {
        return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200;
    }
    
    async function loadMorePosts() {
        if (loading || !hasMore) return;
        
        loading = true;
        document.getElementById('loadingIndicator').style.display = 'block';
        
        const nextPage = currentPage + 1;
        try {
            const response = await fetch(`/?page=${nextPage}&size=10`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            if (response.ok) {
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newPosts = doc.querySelectorAll('.post-item');
                
                if (newPosts.length === 0) {
                    hasMore = false;
                } else {
                    const postList = document.getElementById('postList');
                    newPosts.forEach(post => {
                        postList.appendChild(post.cloneNode(true));
                    });
                    currentPage = nextPage;
                    hasMore = doc.querySelector('#postList').children.length === 10;
                }
            }
        } catch (error) {
            console.error('Error loading posts:', error);
        } finally {
            loading = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }
    
    // Добавляем слушатель прокрутки с debounce
    let scrollTimeout;
    window.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            if (isNearBottom()) {
                loadMorePosts();
            }
        }, 100);
    });
    
    // Инициализация для маленьких экранов
    if (isNearBottom()) {
        loadMorePosts();
    }

    function deletePost(postId) {
        if (confirm('Вы уверены, что хотите удалить этот пост?')) {
            fetch(`/api/posts/${postId}`, {
                method: 'DELETE',
            })
            .then(response => {
                if (response.ok) {
                    const postElement = document.querySelector(`[onclick="deletePost('${postId}')"]`).closest('.post-item');
                    postElement.remove();
                } else {
                    alert('Ошибка при удалении поста');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Ошибка при удалении поста');
            });
        }
    }

    // Открытие SSE подключения для получения новых постов
    const eventSource = new EventSource('/stream');

    // Обработка новых постов
    eventSource.onmessage = function(event) {
        const post = JSON.parse(event.data);
        const postList = document.getElementById('postList');
        const postItem = document.createElement('li');
        postItem.classList.add('post-item');

        postItem.innerHTML = `
            <div class="author-info">
                <div class="author-avatar">
                    <a href="/profile/${post.author}">
                        <img src="${post.authorAvatar || '/uploads/avatars/default.png'}" alt="Avatar" class="avatar">
                    </a>
                </div>
                <a href="/profile/${post.author}" class="author">@${post.author}</a>
            </div>
            <h3>${post.title}</h3>
            <p>${post.content}</p>
            <small>${post.formattedDate}</small>
        `;

        postList.insertBefore(postItem, postList.firstChild);
    };
</script>

</body>
</html>
