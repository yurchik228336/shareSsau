<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/profile.css}">
    <link rel="stylesheet" th:href="@{/header.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
</head>
<body>
    <div th:replace="fragments/header :: header('profile')"></div>


    <div class="container">
        <!-- Баннер пользователя -->
        <div class="profile-banner">
            <img th:src="@{${user.banner}}" alt="Banner" class="banner">
        </div>

        <!-- Аватарка и имя пользователя -->
        <div class="profile-header">
            <div class="profile-avatar">
                <img th:src="@{${user.avatar}}" alt="Avatar" class="avatar">
            </div>
            <div>
                <h1 th:text="${user.username}"></h1>
                <p th:utext="${user.bio != null ? user.bio : 'Описание отсутствует'}" class="user-bio"></p>
            </div>
        </div>

        <!-- Список постов пользователя -->
        <div>
            <h3>Посты пользователя</h3>
            <ul class="post-list">
                <li th:each="post : ${posts}" class="post-item">
                    <div class="author-info">
                        <div class="author-avatar">
                            <a th:href="@{/profile/{username}(username=${post.author})}">
                                <img th:src="@{${post.authorAvatar}}" alt="Avatar" class="avatar-post">
                            </a>
                        </div>
                        <a th:href="@{/profile/{username}(username=${post.author})}" class="author" th:text="'@' + ${post.author}"></a>
                    </div>
                    <h3 th:text="${post.title}"></h3>
                    <p th:utext="${post.content}"></p>
                    <small th:text="${post.formattedDate}"></small>
                    <div sec:authorize="isAuthenticated()">
                        <button th:if="${#authentication.name == post.author}" 
                                class="delete-button" 
                                th:onclick="'deletePost(\'' + ${post.id} + '\')'">🗑️</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        function deletePost(postId) {
            if (confirm('Вы уверены, что хотите удалить этот пост?')) {
                fetch(`/api/posts/${postId}`, {
                    method: 'DELETE',
                })
                .then(response => {
                    if (response.ok) {
                        const postElement = document.querySelector(`[onclick="deletePost('${postId}')"]`).closest('.post-item');
                        postElement.remove();
                    } else {
                        alert('Ошибка при удалении поста');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Ошибка при удалении поста');
                });
            }
        }
    </script>

</body>
</html>
